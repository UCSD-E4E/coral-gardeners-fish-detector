[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-fish-pipeline"
version = "0.1.0"
description = "Coral Gardeners reef fish segmentation, cropping, classification, and evaluation pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aleksa Popovic" }]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "torch>=2.1",
    "open_clip_torch>=2.24",
    "requests>=2.31",
]

[project.scripts]
coral-fish-pipeline = "coral_fish_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
